<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#003b17" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#0a120c" stop-opacity="1" />
      <stop offset="100%" stop-color="#0a0c0a" stop-opacity="1" />
    </radialGradient>
    <filter id="phosphorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Terminal Background -->
  <rect width="512" height="512" rx="110" fill="#0a0c0a" />
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)" />

  <!-- Radar Rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00ff66" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="6,6" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#00ff66" stroke-opacity="0.25" stroke-width="2" />
  <circle cx="256" cy="256" r="70" fill="none" stroke="#00ff66" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Tactical Reticle / Crosshair Lines -->
  <line x1="256" y1="36" x2="256" y2="476" stroke="#00ff66" stroke-opacity="0.2" stroke-width="2" />
  <line x1="36" y1="256" x2="476" y2="256" stroke="#00ff66" stroke-opacity="0.2" stroke-width="2" />

  <!-- Central Glowing Hexagon -->
  <polygon
    points="256,96 394,176 394,336 256,416 118,336 118,176"
    fill="#002b11"
    stroke="#00ff66"
    stroke-width="12"
    stroke-linejoin="round"
    filter="url(#phosphorGlow)"
  />

  <!-- Inner Strategic Node Cluster -->
  <polygon
    points="256,160 338,208 338,304 256,352 174,304 174,208"
    fill="#004d20"
    fill-opacity="0.5"
    stroke="#00ff66"
    stroke-width="4"
    stroke-dasharray="8,4"
  />

  <!-- Core Military Unit Chevron & Tactical Nodes -->
  <circle cx="256" cy="256" r="22" fill="#00ff66" filter="url(#phosphorGlow)" />
  <circle cx="256" cy="256" r="10" fill="#0a0c0a" />

  <circle cx="256" cy="180" r="8" fill="#00ff66" />
  <circle cx="320" cy="292" r="8" fill="#00ff66" />
  <circle cx="192" cy="292" r="8" fill="#00ff66" />

  <!-- Corner Tactical Brackets -->
  <path d="M 60,110 L 60,60 L 110,60" fill="none" stroke="#00ff66" stroke-width="4" stroke-opacity="0.6" />
  <path d="M 452,110 L 452,60 L 402,60" fill="none" stroke="#00ff66" stroke-width="4" stroke-opacity="0.6" />
  <path d="M 60,402 L 60,452 L 110,452" fill="none" stroke="#00ff66" stroke-width="4" stroke-opacity="0.6" />
  <path d="M 452,402 L 452,452 L 402,452" fill="none" stroke="#00ff66" stroke-width="4" stroke-opacity="0.6" />

  <!-- Military Terminal ID Text -->
  <text x="256" y="470" text-anchor="middle" font-family="monospace" font-size="22" font-weight="900" fill="#00ff66" letter-spacing="4" opacity="0.8">
    TILE WARS // MK-X
  </text>
</svg>
